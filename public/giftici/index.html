<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giftici</title>
  <style>
    :root {
      --wall: #1a1a1a;
      --accent: #2c5f4a;
      --danger: #b33;
      --muted: #666;
      --ok: #15803d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #e8e4dc;
      color: #111;
    }
    header {
      padding: 12px 16px;
      background: var(--wall);
      color: #fff;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    .panel {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
      padding: 14px;
      margin-bottom: 14px;
    }
    .total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .total .label {
      font-size: 0.95rem;
      color: var(--muted);
    }
    .total .value {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }
    .panel h2 {
      margin: 0 0 10px;
      font-size: 1rem;
    }
    .hint {
      margin: 0 0 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    input[type="search"],
    input[type="number"],
    select {
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      background: #fff;
    }
    input[type="search"] {
      flex: 1 1 180px;
      min-width: 160px;
    }
    select {
      flex: 0 1 180px;
    }
    input[type="number"] {
      width: 100%;
      margin-bottom: 10px;
    }
    .guest-pick {
      max-height: 240px;
      overflow: auto;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .guest-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      background: #f3f4f6;
      color: #374151;
      white-space: nowrap;
    }
    .guest-badge.toni { background: #dbeafe; color: #1e3a8a; }
    .guest-badge.najdan { background: #ffedd5; color: #9a3412; }
    .guest-badge.ane { background: #dcfce7; color: #14532d; }
    .guest-pick label {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) 140px;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .guest-pick .group-label {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }
    .guest-pick label:last-child { border-bottom: none; }
    .guest-pick label:hover { background: #f7f5f0; }
    .guest-pick input { width: auto; margin: 0; }
    .selected {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 10px;
      min-height: 1.2em;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
    }
    button.primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.danger {
      background: #fee2e2;
      color: #991b1b;
    }
    button.ghost {
      background: #f3f4f6;
      color: #111;
    }
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list li {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 8px rgba(0,0,0,.08);
      padding: 12px 14px;
    }
    .list li.merged {
      border: 1px solid #86efac;
      background: #ecfdf5;
    }
    .entry-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .names {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.7;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #d1fae5;
      color: #065f46;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .entry-edit {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .entry-edit input[type="number"] {
      width: 140px;
      margin: 0;
      padding: 8px 10px;
    }
    .empty, .error {
      text-align: center;
      color: var(--muted);
      padding: 24px 12px;
    }
    .error { color: var(--danger); }

    .side-tab {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      z-index: 40;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      border: none;
      border-radius: 10px 0 0 10px;
      padding: 16px 10px;
      background: var(--wall);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: -2px 4px 14px rgba(0,0,0,.18);
    }
    .side-tab:hover { background: #2a2a2a; }
    .side-tab .count {
      display: inline-block;
      margin-top: 8px;
      writing-mode: horizontal-tb;
      background: #fff;
      color: #111;
      border-radius: 999px;
      min-width: 1.5em;
      padding: 1px 6px;
      font-size: 0.78rem;
      text-align: center;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 50;
      padding: 16px;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      width: min(520px, 100%);
      max-height: min(88vh, 720px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    .modal header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
    }
    .modal header h3 {
      margin: 0;
      font-size: 1.05rem;
    }
    .modal header .close {
      background: #eee;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      padding: 0;
    }
    .modal .modal-meta {
      padding: 10px 16px 0;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .modal .modal-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid #eee;
    }
    .modal .modal-filters input,
    .modal .modal-filters select {
      margin: 0;
      width: auto;
    }
    .modal .modal-filters input {
      flex: 1 1 160px;
      min-width: 140px;
    }
    .modal .missing-list {
      list-style: none;
      margin: 0;
      padding: 8px;
      overflow: auto;
      flex: 1;
    }
    .modal .missing-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    .modal .missing-list li:last-child { border-bottom: none; }
    .modal .missing-empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
    }

    @media (max-width: 640px) {
      .wrap { padding: 10px; }
      .panel { padding: 12px; }
      .filters { flex-direction: column; }
      input[type="search"],
      select {
        width: 100%;
        flex: none;
        font-size: 16px;
      }
      .guest-pick label {
        grid-template-columns: auto minmax(0, 1fr);
      }
      .guest-pick .group-label {
        grid-column: 2;
        text-align: left;
      }
      .entry-edit {
        flex-direction: column;
        align-items: stretch;
      }
      .entry-edit input[type="number"],
      .entry-edit button {
        width: 100%;
      }
      .total .value { font-size: 1.35rem; }
      .side-tab {
        top: auto;
        bottom: 16px;
        right: 12px;
        transform: none;
        writing-mode: horizontal-tb;
        border-radius: 999px;
        padding: 12px 16px;
      }
      .side-tab .count {
        margin-top: 0;
        margin-left: 8px;
      }
      .modal {
        width: 100%;
        max-height: 92vh;
      }
      .modal .modal-filters {
        flex-direction: column;
      }
      .modal .modal-filters input,
      .modal .modal-filters select {
        width: 100%;
        flex: none;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Giftici</h1>
  </header>

  <div class="wrap">
    <div class="panel total">
      <span class="label">Вкупно</span>
      <span class="value" id="total">0 €</span>
    </div>

    <div class="panel">
      <h2>Нов поклон</h2>
      <p class="hint">Одбери гостин(и), или само внеси износ за неозначен плик.</p>
      <div class="filters">
        <input type="search" id="search" placeholder="Пребарај гостин..." autocomplete="off" autofocus />
        <select id="ownerFilter" aria-label="Филтер по група">
          <option value="">Сите групи</option>
          <option value="toni">Тони и Вале</option>
          <option value="najdan">Најдан и Снеже</option>
          <option value="ane">Петар и Ане</option>
        </select>
      </div>
      <div class="guest-pick" id="guestPick"></div>
      <div class="selected" id="selectedLabel">Нема избрани гости.</div>
      <input type="number" id="amount" min="0" step="10" placeholder="Износ (€)" inputmode="numeric" />
      <div class="actions">
        <button type="button" class="primary" id="saveBtn">Зачувај поклон</button>
        <button type="button" class="ghost" id="clearBtn">Исчисти избор</button>
        <button type="button" class="ghost" id="unmarkedBtn">Необележан плик</button>
      </div>
    </div>

    <div class="panel" style="padding:0;background:transparent;box-shadow:none">
      <h2 style="padding:0 2px 8px">Запишани поклони</h2>
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty" hidden>Сè уште нема запишани поклони.</div>
      <div class="error" id="error" hidden></div>
    </div>
  </div>

  <button type="button" class="side-tab" id="missingBtn" aria-haspopup="dialog">
    Без поклон
    <span class="count" id="missingCount">0</span>
  </button>

  <div class="modal-backdrop" id="missingModal" role="dialog" aria-modal="true" aria-labelledby="missingTitle">
    <div class="modal">
      <header>
        <h3 id="missingTitle">Гости без поклон</h3>
        <button type="button" class="close" id="missingClose" aria-label="Затвори">×</button>
      </header>
      <div class="modal-meta" id="missingMeta">0 гости</div>
      <div class="modal-filters">
        <input type="search" id="missingSearch" placeholder="Пребарај..." autocomplete="off" />
        <select id="missingOwnerFilter" aria-label="Филтер по група">
          <option value="">Сите групи</option>
          <option value="toni">Тони и Вале</option>
          <option value="najdan">Најдан и Снеже</option>
          <option value="ane">Петар и Ане</option>
        </select>
      </div>
      <ul class="missing-list" id="missingList"></ul>
      <div class="missing-empty" id="missingEmpty" hidden>Сите гости имаат запишан поклон.</div>
    </div>
  </div>

  <script>
    const searchEl = document.getElementById("search");
    const ownerFilterEl = document.getElementById("ownerFilter");
    const guestPickEl = document.getElementById("guestPick");
    const selectedLabelEl = document.getElementById("selectedLabel");
    const amountEl = document.getElementById("amount");
    const saveBtn = document.getElementById("saveBtn");
    const clearBtn = document.getElementById("clearBtn");
    const unmarkedBtn = document.getElementById("unmarkedBtn");
    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const errorEl = document.getElementById("error");
    const totalEl = document.getElementById("total");
    const missingBtn = document.getElementById("missingBtn");
    const missingCountEl = document.getElementById("missingCount");
    const missingModal = document.getElementById("missingModal");
    const missingClose = document.getElementById("missingClose");
    const missingMeta = document.getElementById("missingMeta");
    const missingSearch = document.getElementById("missingSearch");
    const missingOwnerFilter = document.getElementById("missingOwnerFilter");
    const missingList = document.getElementById("missingList");
    const missingEmpty = document.getElementById("missingEmpty");

    let availableGuests = [];
    let entries = [];
    let selected = new Set();

    const OWNER_LABELS = {
      toni: "Тони и Вале",
      najdan: "Најдан и Снеже",
      ane: "Петар и Ане",
    };

    function formatMoney(n) {
      return `${Number(n || 0).toLocaleString("mk-MK")} €`;
    }

    function guestBadge(guest) {
      const el = document.createElement("span");
      el.className = "guest-badge" + (guest.owner ? ` ${guest.owner}` : "");
      el.textContent = guest.name;
      if (guest.owner && OWNER_LABELS[guest.owner]) {
        el.title = OWNER_LABELS[guest.owner];
      }
      return el;
    }

    function appendGuestNames(container, guests) {
      for (const g of guests || []) {
        container.appendChild(guestBadge(g));
      }
    }

    function updateSelectedLabel() {
      const names = availableGuests
        .filter((g) => selected.has(g.id))
        .map((g) => g.name);
      if (!names.length) {
        selectedLabelEl.textContent = "Нема избрани гости — ќе се зачува како неозначен плик.";
      } else if (names.length === 1) {
        selectedLabelEl.textContent = `Избран: ${names[0]}`;
      } else {
        selectedLabelEl.textContent = `Заеднички поклон (${names.length}): ${names.join(" · ")}`;
      }
    }

    function renderGuestPick() {
      const q = searchEl.value.trim().toLowerCase();
      const ownerQ = ownerFilterEl.value;
      const rows = availableGuests.filter((g) => {
        if (ownerQ && g.owner !== ownerQ) return false;
        if (!q) return true;
        return g.name.toLowerCase().includes(q);
      });
      guestPickEl.innerHTML = "";
      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.style.padding = "16px";
        empty.textContent = availableGuests.length
          ? "Нема резултати."
          : "Сите гости веќе имаат запишан поклон.";
        guestPickEl.appendChild(empty);
        return;
      }
      for (const g of rows) {
        const label = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = selected.has(g.id);
        cb.addEventListener("change", () => {
          if (cb.checked) selected.add(g.id);
          else selected.delete(g.id);
          updateSelectedLabel();
        });
        const group = document.createElement("span");
        group.className = "group-label";
        group.textContent = OWNER_LABELS[g.owner] || "";
        label.appendChild(cb);
        label.appendChild(guestBadge(g));
        label.appendChild(group);
        guestPickEl.appendChild(label);
      }
    }

    function applyData(data) {
      entries = data.entries || [];
      availableGuests = data.availableGuests || [];
      selected = new Set([...selected].filter((id) => availableGuests.some((g) => g.id === id)));
      totalEl.textContent = formatMoney(data.total || 0);
      missingCountEl.textContent = String(availableGuests.length);
      updateSelectedLabel();
      renderGuestPick();
      renderEntries();
      if (missingModal.classList.contains("open")) renderMissingList();
    }

    function renderMissingList() {
      const q = missingSearch.value.trim().toLowerCase();
      const ownerQ = missingOwnerFilter.value;
      const rows = availableGuests.filter((g) => {
        if (ownerQ && g.owner !== ownerQ) return false;
        if (!q) return true;
        return g.name.toLowerCase().includes(q);
      });
      missingList.innerHTML = "";
      missingMeta.textContent = `${rows.length} од ${availableGuests.length} гости`;
      if (!availableGuests.length) {
        missingEmpty.hidden = false;
        missingEmpty.textContent = "Сите гости имаат запишан поклон.";
        return;
      }
      if (!rows.length) {
        missingEmpty.hidden = false;
        missingEmpty.textContent = "Нема резултати.";
        return;
      }
      missingEmpty.hidden = true;
      for (const g of rows) {
        const li = document.createElement("li");
        li.appendChild(guestBadge(g));
        const group = document.createElement("span");
        group.style.fontSize = "0.78rem";
        group.style.color = "var(--muted)";
        group.textContent = OWNER_LABELS[g.owner] || "";
        li.appendChild(group);
        missingList.appendChild(li);
      }
    }

    function openMissingModal() {
      missingModal.classList.add("open");
      renderMissingList();
      missingSearch.focus();
    }

    function closeMissingModal() {
      missingModal.classList.remove("open");
    }

    function renderEntries() {
      listEl.innerHTML = "";
      emptyEl.hidden = entries.length > 0;
      for (const entry of entries) {
        const li = document.createElement("li");
        if (entry.guests.length > 1) li.classList.add("merged");

        const top = document.createElement("div");
        top.className = "entry-top";
        const names = document.createElement("div");
        names.className = "names";
        if (entry.guests?.length) appendGuestNames(names, entry.guests);
        else {
          names.textContent = "Необележан плик";
          names.style.fontStyle = "italic";
          names.style.color = "var(--muted)";
          names.style.fontWeight = "600";
        }
        top.appendChild(names);
        if (entry.guests.length > 1) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "Заеднички";
          top.appendChild(badge);
        } else if (!entry.guests.length) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.style.background = "#f3f4f6";
          badge.style.color = "#374151";
          badge.textContent = "Без гостин";
          top.appendChild(badge);
        }

        const edit = document.createElement("div");
        edit.className = "entry-edit";
        const input = document.createElement("input");
        input.type = "number";
        input.min = "0";
        input.step = "10";
        input.value = String(entry.amount);
        input.setAttribute("aria-label", "Износ");

        const save = document.createElement("button");
        save.type = "button";
        save.className = "primary";
        save.textContent = "Зачувај";
        save.addEventListener("click", () => updateAmount(entry.id, input.value));

        const del = document.createElement("button");
        del.type = "button";
        del.className = "danger";
        del.textContent = "Избриши";
        del.addEventListener("click", () => removeEntry(entry.id));

        edit.appendChild(input);
        edit.appendChild(save);
        edit.appendChild(del);

        li.appendChild(top);
        li.appendChild(edit);
        listEl.appendChild(li);
      }
    }

    async function load() {
      errorEl.hidden = true;
      try {
        const res = await fetch("/api/gifts");
        if (!res.ok) throw new Error(await res.text());
        applyData(await res.json());
      } catch (err) {
        console.error(err);
        errorEl.hidden = false;
        errorEl.textContent = "Не може да се вчитаат поклоните.";
      }
    }

    async function saveGift({ requireAmount = false } = {}) {
      const guestIds = [...selected];
      const amount = amountEl.value;
      if (requireAmount && (amount === "" || Number(amount) <= 0)) {
        alert("Внеси износ за неозначен плик.");
        amountEl.focus();
        return;
      }
      if (!guestIds.length && (amount === "" || Number(amount) < 0)) {
        alert("Внеси износ или одбери гостин.");
        amountEl.focus();
        return;
      }
      try {
        saveBtn.disabled = true;
        unmarkedBtn.disabled = true;
        const res = await fetch("/api/gifts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ guestIds, amount: amount === "" ? 0 : amount }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Save failed");
        selected = new Set();
        amountEl.value = "";
        searchEl.value = "";
        ownerFilterEl.value = "";
        applyData(data);
      } catch (err) {
        console.error(err);
        alert(err.message || "Грешка при зачувување.");
        updateSelectedLabel();
      } finally {
        saveBtn.disabled = false;
        unmarkedBtn.disabled = false;
      }
    }

    async function updateAmount(id, amount) {
      try {
        const res = await fetch("/api/gifts", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, amount }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Update failed");
        applyData(data);
      } catch (err) {
        console.error(err);
        alert(err.message || "Грешка при зачувување.");
      }
    }

    async function removeEntry(id) {
      if (!confirm("Да се избрише овој поклон?")) return;
      try {
        const res = await fetch("/api/gifts", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Delete failed");
        applyData(data);
      } catch (err) {
        console.error(err);
        alert(err.message || "Грешка при бришење.");
      }
    }

    searchEl.addEventListener("input", renderGuestPick);
    ownerFilterEl.addEventListener("change", renderGuestPick);
    saveBtn.addEventListener("click", () => saveGift());
    clearBtn.addEventListener("click", () => {
      selected = new Set();
      updateSelectedLabel();
      renderGuestPick();
    });
    unmarkedBtn.addEventListener("click", () => {
      selected = new Set();
      updateSelectedLabel();
      renderGuestPick();
      saveGift({ requireAmount: true });
    });
    amountEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") saveGift();
    });
    missingBtn.addEventListener("click", openMissingModal);
    missingClose.addEventListener("click", closeMissingModal);
    missingModal.addEventListener("click", (e) => {
      if (e.target === missingModal) closeMissingModal();
    });
    missingSearch.addEventListener("input", renderMissingList);
    missingOwnerFilter.addEventListener("change", renderMissingList);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && missingModal.classList.contains("open")) {
        closeMissingModal();
      }
    });

    load();
  </script>
</body>
</html>
